<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Label Analyzer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .content {
            text-align: center;
            color: white;
            z-index: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        p {
            font-size: 22px;
            margin-bottom: 20px;
        }

        button {
            background-color: hsl(356, 67%, 36%);
            color: white;
            padding: 15px 32px;
            font-size: 20px;
            border: none;
            cursor: pointer;
            margin: 10px;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <video autoplay loop muted>
        <source src="assets/videos/Untitled design.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div class="content">
        <h1>Nutrition Label Analyzer</h1>
        <p>Input, Discover, and Make Smarter Choices.</p> 
        <button onclick="goToNextPage()">START NOW</button> 
    </div>

    <script>
        function goToNextPage() {
            window.location.href = "manual.html"; 
        }
    </script>

</body>
</html>
