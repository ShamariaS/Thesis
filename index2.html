<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Option</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #6b1313;
            margin: 0;
        }

        #video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .cards-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .option-card {
            background-color: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 20px;
            border-radius: 12px;
            width: 250px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .option-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #0b0b0b;
        }

        .option-card p {
            font-size: 16px;
            color: #7f8c8d;
        }

        .option-card:hover {
            background-color: #3498db;
            color: white;
            transform: translateY(-10px); 
        }

        .option-card i {
            font-size: 30px;
            margin-bottom: 10px;
            color: #3498db;
        }

        .option-card:hover i {
            color: white;
        }

    </style>
</head>
<body>

    <video id="video-bg" autoplay loop muted>
        <source src="assets/videos/Untitled design.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

<div class="cards-container">
    <div class="option-card" onclick="window.location.href='manual.html'">
        <i class="fa fa-pencil"></i> 
        <h3>Manual Entry</h3>
        <p><strong>Want to know more? Analyze another nutrition label!</strong></p>
    </div>

    
    <div class="option-card" onclick="window.location.href='chatbot.html'">
        <i class="fa fa-comments"></i> 
        <h3>Chatbot</h3>
        <p><strong>Ask more questions about nutrition!</strong></p>
    </div>

    <div class="option-card" onclick="window.location.href='index.html'">
        <i class="fa fa-camera"></i> 
        <h3>Homepage</h3>
        <p><strong>Return to the homepage! Hope you enjoyed!</strong></p>
    </div>
</div>

</body>
</html>
